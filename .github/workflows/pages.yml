name: Publish download site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  release:
    types: [published, edited, released, unpublished, deleted]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A release event can point at an older tag. Always publish the current guide.
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/configure-pages@v5
      - name: Include the latest official XPI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release" \
            --pattern '*.xpi' --pattern 'updates.json'
          cd "$RUNNER_TEMP/release"
          xpis=(*.xpi)
          [[ ${#xpis[@]} -eq 1 ]]
          hash=$(jq -er '.addons["zotero2notion@local.plugin"].updates[0].update_hash
            | capture("^sha256:(?<hash>[a-f0-9]{64})$").hash' updates.json)
          printf '%s  %s\n' "$hash" "${xpis[0]}" | sha256sum --check
          cp "${xpis[0]}" "$GITHUB_WORKSPACE/site/download.xpi"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
